name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Generate Placeholder Keystore
        run: keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Vibro"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Find and Prepare Release Assets
        run: |
          mkdir -p outputs/
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} outputs/VibroMarketplace.apk \;
          echo "Release asset prepared successfully."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: outputs/VibroMarketplace.apk
          name: Release ${{ github.ref_name }}
          body: |
            Automatic release generated by Vibro CI/CD workflow.
            
            ### Installation
            1. Download the `VibroMarketplace.apk` file attached below.
            2. Run the file on your Android device to install or update the app.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
